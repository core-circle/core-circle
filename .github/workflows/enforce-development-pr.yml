name: Enforce Development PR Pipeline

on:
  pull_request:
    branches:
      - development
      - develop
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # 1. Gatekeeper: Validates that PR does not target identical branch
  check-source-branch:
    name: check-source-branch
    runs-on: ubuntu-latest
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ready_to_merge'
    steps:
      - name: Validate Source Branch
        run: |
          echo "Target branch: ${{ github.base_ref }}"
          echo "Source branch: ${{ github.head_ref }}"

          if [ "${{ github.head_ref }}" = "${{ github.base_ref }}" ]; then
            echo "::error::Source branch cannot be identical to target branch '${{ github.base_ref }}'."
            exit 1
          fi

          echo "Validation passed: Source branch is '${{ github.head_ref }}'."

  # 2. Gatekeeper: Enforces that PR has 'ready_to_merge' label
  check-ready-to-merge:
    name: check-ready-to-merge
    runs-on: ubuntu-latest
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ready_to_merge' ||
      github.event.action == 'unlabeled'
    steps:
      - name: Verify 'ready_to_merge' label
        run: |
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'ready_to_merge') }}" = "true" ]; then
            echo "Passed: 'ready_to_merge' label is present."
          else
            echo "::error::PR is missing the mandatory 'ready_to_merge' label. An authorized reviewer or Code Owner must add this label before the PR can be merged into development."
            exit 1
          fi

      - name: Comment on PR if 'ready_to_merge' Label Missing
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            const body = `### ⛔ Missing Mandatory Label: \`ready_to_merge\`\n\nPull requests targeting \`development\` require the **\`ready_to_merge\`** approval label before they can be merged.\n\n* **Status**: Blocked\n* **Action Required**: An authorized reviewer or Code Owner must review the changes and attach the \`ready_to_merge\` label.`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  # 3. Gatekeeper: Enforces that PR has 'build_and_lint' (or 'build') label
  check-build-and-lint-label:
    name: check-build-and-lint-label
    runs-on: ubuntu-latest
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      contains(fromJSON('["build", "build_and_lint", "build-and-lint", "lint-and-build", "lint"]'), github.event.label.name) ||
      github.event.action == 'unlabeled'
    steps:
      - name: Verify 'build_and_lint' or 'build' label
        run: |
          HAS_BUILD_LABEL="false"
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'build_and_lint') }}" = "true" ] || \
             [ "${{ contains(github.event.pull_request.labels.*.name, 'build-and-lint') }}" = "true" ] || \
             [ "${{ contains(github.event.pull_request.labels.*.name, 'build') }}" = "true" ] || \
             [ "${{ contains(github.event.pull_request.labels.*.name, 'lint-and-build') }}" = "true" ]; then
            HAS_BUILD_LABEL="true"
          fi

          if [ "$HAS_BUILD_LABEL" = "true" ]; then
            echo "Passed: Mandatory build & lint label is present on PR."
          else
            echo "::error::PR is missing the mandatory 'build_and_lint' (or 'build') label. Please attach this label to trigger and enforce the build & lint pipeline before merging into development."
            exit 1
          fi

      - name: Comment on PR if Build/Lint Label Missing
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            const body = `### ⛔ Missing Mandatory Label: \`build_and_lint\`\n\nPull requests targeting \`development\` must have the **\`build_and_lint\`** (or \`build\`) label attached to trigger and verify compilation and linting.\n\n* **Status**: Blocked\n* **Action Required**: Add the \`build_and_lint\` (or \`build\`) label to this PR.`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  # 4. Monorepo Lint & Build Check
  lint-and-build:
    name: lint-and-build
    runs-on: ubuntu-latest
    if: >-
      (
        (github.event.action != 'labeled' && github.event.action != 'unlabeled') &&
        (
          contains(github.event.pull_request.labels.*.name, 'build_and_lint') ||
          contains(github.event.pull_request.labels.*.name, 'build-and-lint') ||
          contains(github.event.pull_request.labels.*.name, 'build') ||
          contains(github.event.pull_request.labels.*.name, 'lint-and-build')
        )
      ) ||
      (
        github.event.action == 'labeled' &&
        contains(fromJSON('["build", "build_and_lint", "build-and-lint", "lint-and-build", "lint"]'), github.event.label.name)
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Lint
        run: npx nx run-many -t lint

      - name: Build Packages
        run: npx nx run-many -t build -p tag:package

      - name: Build Web Docs
        run: npx nx build @core-circle/docs

      - name: Build UI Storybook
        run: npm run build-storybook

      - name: Comment on PR on Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            const body = `### ✅ Development Lint, Build & Storybook Passed!\n\nAll packages, web documentation, and UI Storybook compiled with zero errors on commit \`${context.sha.substring(0, 7)}\`.\n\n* ✨ **Target**: \`development\`\n* 📦 **Status**: Clean compilation. Ready for merge review.`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Comment on PR on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `### ❌ Development Build, Lint & Storybook Check Failed\n\nThe automated **lint-and-build** check encountered errors on commit \`${context.sha.substring(0, 7)}\`.\n\n🔍 **Action Required**: Please inspect the failure logs and fix the reported errors before merging:\n👉 [View Failure Logs in GitHub Actions](${runUrl})\n\n*Merging into \`development\` is blocked until this check passes.*`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  # 5. On-Demand: Run tests
  run-tests:
    name: run-tests
    runs-on: ubuntu-latest
    if: >-
      (
        (github.event.action != 'labeled' && github.event.action != 'unlabeled') &&
        contains(github.event.pull_request.labels.*.name, 'run:test')
      ) ||
      (github.event.action == 'labeled' && github.event.label.name == 'run:test')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Unit Tests
        run: npx nx run-many -t test

      - name: Comment on PR on Test Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            const body = `### ✅ Unit Tests Passed!\n\nAll unit test suites ran and passed successfully on commit \`${context.sha.substring(0, 7)}\`.`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Comment on PR on Test Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `### ❌ Unit Tests Failed\n\nUnit tests failed on commit \`${context.sha.substring(0, 7)}\`.\n\n🔍 **View Test Logs**: [GitHub Actions Run](${runUrl})`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  # 6. On-Demand: Run Storybook build
  run-storybook:
    name: run-storybook
    runs-on: ubuntu-latest
    if: >-
      (
        (github.event.action != 'labeled' && github.event.action != 'unlabeled') &&
        contains(github.event.pull_request.labels.*.name, 'run:storybook')
      ) ||
      (github.event.action == 'labeled' && github.event.label.name == 'run:storybook')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Storybook
        run: npm run build-storybook

      - name: Comment on PR on Storybook Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            const body = `### ✅ Storybook Build Passed!\n\nUI Storybook was built successfully with zero errors on commit \`${context.sha.substring(0, 7)}\`.`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Comment on PR on Storybook Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `### ❌ Storybook Build Failed\n\nStorybook build failed on commit \`${context.sha.substring(0, 7)}\`.\n\n🔍 **View Logs**: [GitHub Actions Run](${runUrl})`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
