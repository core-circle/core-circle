name: Publish Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force publish all packages'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@core-circle'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npx nx run-many -t build -p tag:package

      - name: Publish packages
        run: npx nx run-many -t publish -p tag:package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
