name: Publish Packages

on:
  push:
    branches:
      - main
      - feature/core-circle/webapp-setup
    paths:
      - 'packages/**'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force publish all packages'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@core-circle'

      - name: Install dependencies
        run: npm install

      - name: Determine Command Type
        id: cmd
        run: |
          # Default to affected
          COMMAND="affected"
          EXTRA_FLAGS="--base=origin/main~1 --head=HEAD"
          
          # Check for manual force
          if [ "${{ github.event.inputs.force }}" == "true" ]; then
            COMMAND="run-many"
            EXTRA_FLAGS=""
            echo "Reason: Manual force trigger"
          # Check for commit message tag
          elif [[ "${{ github.event.head_commit.message }}" == *"[force-publish]"* ]]; then
            COMMAND="run-many"
            EXTRA_FLAGS=""
            echo "Reason: [force-publish] tag in commit"
          fi
          
          echo "nx_cmd=$COMMAND" >> $GITHUB_OUTPUT
          echo "nx_flags=$EXTRA_FLAGS" >> $GITHUB_OUTPUT

      - name: Build packages
        run: npx nx ${{ steps.cmd.outputs.nx_cmd }} -t build ${{ steps.cmd.outputs.nx_flags }}

      - name: Publish packages
        run: npx nx ${{ steps.cmd.outputs.nx_cmd }} -t publish ${{ steps.cmd.outputs.nx_flags }} -p tag:package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
