name: Publish Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: 'Specific package to publish (default: all)'
        type: choice
        options:
          - all
          - '@core-circle/ui'
          - '@core-circle/theme'
          - '@core-circle/icons'
        default: all

permissions:
  contents: read
  packages: write
  pull-requests: write
  issues: write

jobs:
  check-publish:
    name: check-publish-trigger
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      pr_number: ${{ steps.check.outputs.pr_number }}
      project_selector: ${{ steps.check.outputs.project_selector }}
    steps:
      - name: Verify Publish Trigger
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              const selected = '${{ github.event.inputs.package }}' || 'all';
              const selector = (selected !== 'all' && selected !== '') ? `-p ${selected}` : '-p tag:package';
              core.setOutput('should_publish', 'true');
              core.setOutput('pr_number', '');
              core.setOutput('project_selector', selector);
              return;
            }

            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            const pr = prs.data.find(p => p.merged_at !== null) || prs.data[0];

            if (!pr) {
              core.setOutput('should_publish', 'false');
              core.setOutput('pr_number', '');
              core.setOutput('project_selector', '');
              return;
            }

            const hasPublishLabel = pr.labels.some(l => l.name === 'build_publish_package');
            if (!hasPublishLabel) {
              core.setOutput('should_publish', 'false');
              core.setOutput('pr_number', String(pr.number));
              core.setOutput('project_selector', '');
              return;
            }

            let projects = [];
            if (pr.labels.some(l => l.name === 'pkg:ui')) projects.push('@core-circle/ui');
            if (pr.labels.some(l => l.name === 'pkg:theme')) projects.push('@core-circle/theme');
            if (pr.labels.some(l => l.name === 'pkg:icons')) projects.push('@core-circle/icons');

            const selector = projects.length > 0 ? `-p ${projects.join(',')}` : '-p tag:package';
            core.setOutput('should_publish', 'true');
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('project_selector', selector);

  publish:
    name: publish-packages
    needs: check-publish
    if: needs.check-publish.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@core-circle'

      - name: Install dependencies
        run: npm install

      - name: Build target packages
        run: npx nx run-many -t build ${{ needs.check-publish.outputs.project_selector }}

      - name: Publish target packages
        run: npx nx run-many -t publish ${{ needs.check-publish.outputs.project_selector }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR on Successful Package Publish
        if: success() && needs.check-publish.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ needs.check-publish.outputs.pr_number }}', 10);
            const selector = '${{ needs.check-publish.outputs.project_selector }}' || 'All Packages';
            const body = `### 📦 Packages Published Successfully!\n\nThe automated release has published to GitHub Packages:\n\n* **Packages targeted**: \`${selector}\`\n* **Registry**: \`https://npm.pkg.github.com/@core-circle\`\n\nTo install downstream:\n\`\`\`bash\nnpm install @core-circle/ui@latest\n\`\`\``;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Comment on PR on Package Publish Failure
        if: failure() && needs.check-publish.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ needs.check-publish.outputs.pr_number }}', 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `### ❌ Package Publishing Failed\n\nThe automated package publish encountered an error.\n\n🔍 **View Error Logs**: [GitHub Actions Run](${runUrl})\n\n💡 *Tip: Ensure the \`"version"\` field in \`package.json\` was bumped from the previous release.*`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
