name: Enforce Main PR Pipeline

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

jobs:
  # 1. Gatekeeper: Validates that PR comes strictly from 'development' (or 'develop')
  check-source-branch:
    name: check-source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate Source Branch
        run: |
          echo "Target branch: ${{ github.base_ref }}"
          echo "Source branch: ${{ github.head_ref }}"
          
          if [ "${{ github.head_ref }}" != "development" ] && [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::Direct PRs to 'main' must originate from 'development' (or 'develop') only."
            echo "Current source branch is '${{ github.head_ref }}'."
            echo "Action required: Merge your changes into 'development' first, then open a PR from 'development' to 'main'."
            exit 1
          fi
          
          echo "Validation passed: Source branch is '${{ github.head_ref }}'."

  # 2. Gatekeeper: Enforces that Code Owner applied 'ready_to_merge' label
  check-ready-to-merge:
    name: check-ready-to-merge
    runs-on: ubuntu-latest
    steps:
      - name: Verify 'ready_to_merge' label
        run: |
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'ready_to_merge') }}" = "true" ]; then
            echo "Passed: 'ready_to_merge' label is present."
          else
            echo "::error::PR is missing the 'ready_to_merge' label. The Code Owner (@1694srinivasan) must add this label before the PR can be merged into main."
            exit 1
          fi

  # 3. On-Demand: Lint and build entire monorepo (triggers on 'build', 'build_publish_package', or 'deploy_pages' label)
  lint-and-build:
    name: lint-and-build
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'build') || contains(github.event.pull_request.labels.*.name, 'build_publish_package') || contains(github.event.pull_request.labels.*.name, 'deploy_pages')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Lint
        run: npx nx run-many -t lint

      - name: Run Build
        run: npx nx run-many -t build

  # 4. On-Demand: Run tests (triggers on 'run:test' label)
  run-tests:
    name: run-tests
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'run:test')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Unit Tests
        run: npx nx run-many -t test

  # 5. On-Demand: Run Storybook build (triggers on 'run:storybook' label)
  run-storybook:
    name: run-storybook
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'run:storybook')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Storybook
        run: npm run build-storybook

  # 6. On-Demand: Verify Packages Build (triggers on 'build_publish_package' label)
  verify-packages-build:
    name: verify-packages-build
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'build_publish_package')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Determine Target Packages
        run: |
          PROJECTS=""
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'pkg:ui') }}" = "true" ]; then
            PROJECTS="${PROJECTS:+$PROJECTS,}@core-circle/ui"
          fi
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'pkg:theme') }}" = "true" ]; then
            PROJECTS="${PROJECTS:+$PROJECTS,}@core-circle/theme"
          fi
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'pkg:icons') }}" = "true" ]; then
            PROJECTS="${PROJECTS:+$PROJECTS,}@core-circle/icons"
          fi
          if [ -z "$PROJECTS" ]; then
            echo "PROJECT_SELECTOR=-p tag:package" >> $GITHUB_ENV
          else
            echo "PROJECT_SELECTOR=-p $PROJECTS" >> $GITHUB_ENV
          fi

      - name: Build Packages (Pre-Publish Verification)
        run: npx nx run-many -t build $PROJECT_SELECTOR
