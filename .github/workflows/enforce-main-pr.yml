name: Enforce Main PR Pipeline

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # 1. Gatekeeper: Validates that PR comes strictly from 'development' (or 'develop')
  check-source-branch:
    name: check-source-branch
    runs-on: ubuntu-latest
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ready_to_merge'
    steps:
      - name: Validate Source Branch
        run: |
          echo "Target branch: ${{ github.base_ref }}"
          echo "Source branch: ${{ github.head_ref }}"

          if [ "${{ github.head_ref }}" != "development" ] && [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::Direct PRs to 'main' must originate from 'development' (or 'develop') only."
            echo "Current source branch is '${{ github.head_ref }}'."
            echo "Action required: Merge your changes into 'development' first, then open a PR from 'development' to 'main'."
            exit 1
          fi

          echo "Validation passed: Source branch is '${{ github.head_ref }}'."

      - name: Comment on PR if Source Branch Invalid
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            const body = `### ⛔ Direct PR to \`main\` Blocked\n\nDirect pull requests to \`main\` must originate strictly from the \`development\` (or \`develop\`) branch.\n\n* **Current source branch**: \`${context.payload.pull_request?.head?.ref || 'unknown'}\`\n* **Required source branch**: \`development\`\n\n👉 **Action Required**: Please merge your changes into \`development\` first, then open a PR from \`development\` to \`main\`.`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  # 2. Gatekeeper: Enforces that Code Owner applied 'ready_to_merge' label
  check-ready-to-merge:
    name: check-ready-to-merge
    runs-on: ubuntu-latest
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ready_to_merge'
    steps:
      - name: Verify 'ready_to_merge' label
        run: |
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'ready_to_merge') }}" = "true" ]; then
            echo "Passed: 'ready_to_merge' label is present."
          else
            echo "::error::PR is missing the 'ready_to_merge' label. The Code Owner (@1694srinivasan) must add this label before the PR can be merged into main."
            exit 1
          fi

  # 3. Monorepo Lint & Build Check
  lint-and-build:
    name: lint-and-build
    runs-on: ubuntu-latest
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      (github.event.action == 'labeled' && contains(fromJSON('["build", "deploy_pages", "build_publish_package"]'), github.event.label.name))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Lint
        run: npx nx run-many -t lint

      - name: Run Tests & Check Coverage (80% Individual Limit)
        run: npx nx run-many -t test --coverage

      - name: Build Packages
        run: npx nx run-many -t build -p tag:package

      - name: Build Web Docs
        run: npx nx build @core-circle/docs

      - name: Build UI Storybook
        run: npm run build-storybook

      - name: Comment on PR on Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            const body = `### ✅ Lint, Test, Build & Storybook Passed!\n\nAll packages, web documentation, and UI Storybook compiled with zero errors and test coverage met the >= 80% individual threshold on commit \`${context.sha.substring(0, 7)}\`.\n\n* ✨ **Status**: Clean compilation and test pass. Ready for review and merge.`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Comment on PR on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `### ❌ Lint, Test, Build or Storybook Check Failed\n\nThe automated **lint-and-build** check encountered errors or failed the 80% coverage threshold on commit \`${context.sha.substring(0, 7)}\`.\n\n🔍 **Action Required**: Please inspect the failure logs and fix the reported errors before merging:\n👉 [View Failure Logs in GitHub Actions](${runUrl})\n\n*Merging into \`main\` is blocked until this check passes.*`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  # 4. On-Demand: Run tests
  run-tests:
    name: run-tests
    runs-on: ubuntu-latest
    if: >-
      (
        (github.event.action != 'labeled' && github.event.action != 'unlabeled') &&
        contains(github.event.pull_request.labels.*.name, 'run:test')
      ) ||
      (github.event.action == 'labeled' && github.event.label.name == 'run:test')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Unit Tests
        run: npx nx run-many -t test

      - name: Comment on PR on Test Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            const body = `### ✅ Unit Tests Passed!\n\nAll unit test suites ran and passed successfully on commit \`${context.sha.substring(0, 7)}\`.`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Comment on PR on Test Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `### ❌ Unit Tests Failed\n\nUnit tests failed on commit \`${context.sha.substring(0, 7)}\`.\n\n🔍 **View Test Logs**: [GitHub Actions Run](${runUrl})`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  # 5. On-Demand: Run Storybook build
  run-storybook:
    name: run-storybook
    runs-on: ubuntu-latest
    if: >-
      (
        (github.event.action != 'labeled' && github.event.action != 'unlabeled') &&
        contains(github.event.pull_request.labels.*.name, 'run:storybook')
      ) ||
      (github.event.action == 'labeled' && github.event.label.name == 'run:storybook')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Storybook
        run: npm run build-storybook

      - name: Comment on PR on Storybook Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            const body = `### ✅ Storybook Build Passed!\n\nUI Storybook was built successfully with zero errors on commit \`${context.sha.substring(0, 7)}\`.`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Comment on PR on Storybook Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `### ❌ Storybook Build Failed\n\nStorybook build failed on commit \`${context.sha.substring(0, 7)}\`.\n\n🔍 **View Logs**: [GitHub Actions Run](${runUrl})`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  # 6. On-Demand: Verify Packages Build
  verify-packages-build:
    name: verify-packages-build
    runs-on: ubuntu-latest
    if: >-
      (
        (github.event.action != 'labeled' && github.event.action != 'unlabeled') &&
        contains(github.event.pull_request.labels.*.name, 'build_publish_package')
      ) ||
      (github.event.action == 'labeled' && github.event.label.name == 'build_publish_package')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Determine Target Packages
        run: |
          PROJECTS=""
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'pkg:ui') }}" = "true" ]; then
            PROJECTS="${PROJECTS:+$PROJECTS,}@core-circle/ui"
          fi
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'pkg:theme') }}" = "true" ]; then
            PROJECTS="${PROJECTS:+$PROJECTS,}@core-circle/theme"
          fi
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'pkg:icons') }}" = "true" ]; then
            PROJECTS="${PROJECTS:+$PROJECTS,}@core-circle/icons"
          fi
          if [ -z "$PROJECTS" ]; then
            echo "PROJECT_SELECTOR=-p tag:package" >> $GITHUB_ENV
          else
            echo "PROJECT_SELECTOR=-p $PROJECTS" >> $GITHUB_ENV
          fi

      - name: Build Packages (Pre-Publish Verification)
        run: npx nx run-many -t build $PROJECT_SELECTOR

      - name: Comment on PR on Verification Success
        if: success()
        uses: actions/github-script@v7
        env:
          PROJECT_SELECTOR: ${{ env.PROJECT_SELECTOR }}
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            const selector = process.env.PROJECT_SELECTOR || 'All Packages';
            const body = `### ✅ Package Build Verification Passed!\n\nPre-publish package build verification completed successfully on commit \`${context.sha.substring(0, 7)}\`:\n\n* **Target**: \`${selector}\`\n* Packages are validated and ready for publish upon merge.`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Comment on PR on Verification Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `### ❌ Package Build Verification Failed\n\nPackage build verification failed on commit \`${context.sha.substring(0, 7)}\`.\n\n🔍 **View Logs**: [GitHub Actions Run](${runUrl})`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
