name: Deploy Web Docs & Storybook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  issues: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  check-deploy:
    name: check-deployment-trigger
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - name: Verify Trigger Conditions
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              console.log('Manual workflow_dispatch: proceeding with deployment.');
              core.setOutput('should_deploy', 'true');
              core.setOutput('pr_number', '');
              return;
            }

            console.log(`Checking PRs associated with commit ${context.sha}...`);
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            const pr = prs.data.find(p => p.merged_at !== null) || prs.data[0];

            if (!pr) {
              console.log('No PR associated with commit. Skipping deployment.');
              core.setOutput('should_deploy', 'false');
              core.setOutput('pr_number', '');
              return;
            }

            console.log(`Found PR #${pr.number}: ${pr.title}`);
            const hasLabel = pr.labels.some(l => l.name === 'deploy_pages');
            console.log(`PR #${pr.number} has 'deploy_pages' label: ${hasLabel}`);

            core.setOutput('should_deploy', hasLabel ? 'true' : 'false');
            core.setOutput('pr_number', String(pr.number));

  deploy:
    name: deploy-gh-pages
    needs: check-deploy
    if: needs.check-deploy.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build Next.js Web Docs
        env:
          DEPLOY_TARGET: gh-pages
        run: npx nx build @core-circle/docs

      - name: Build UI Storybook
        run: npm run build-storybook

      - name: Consolidate GitHub Pages Bundle
        run: |
          mkdir -p dist/gh-pages
          
          # 1. Copy Next.js exported docs to root of dist/gh-pages
          if [ -d "dist/src/app/docs/out" ]; then
            cp -r dist/src/app/docs/out/* dist/gh-pages/
          elif [ -d "src/app/docs/out" ]; then
            cp -r src/app/docs/out/* dist/gh-pages/
          elif [ -d "dist/src/app/docs" ]; then
            cp -r dist/src/app/docs/* dist/gh-pages/
          fi
          
          # 2. Copy Storybook into /storybook subfolder
          mkdir -p dist/gh-pages/storybook
          if [ -d "packages/ui/storybook-static" ]; then
            cp -r packages/ui/storybook-static/* dist/gh-pages/storybook/
          elif [ -d "dist/storybook/@core-circle/ui" ]; then
            cp -r dist/storybook/@core-circle/ui/* dist/gh-pages/storybook/
          elif [ -d "dist/storybook/packages/ui" ]; then
            cp -r dist/storybook/packages/ui/* dist/gh-pages/storybook/
          elif [ -d "storybook-static" ]; then
            cp -r storybook-static/* dist/gh-pages/storybook/
          fi
          
          # 3. Disable Jekyll processing so _next assets load properly
          touch dist/gh-pages/.nojekyll
          
          echo "GitHub Pages bundle prepared at dist/gh-pages"
          ls -la dist/gh-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/gh-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment on PR on Successful Deployment
        if: success() && needs.check-deploy.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ needs.check-deploy.outputs.pr_number }}', 10);
            const body = `### 🚀 Deployed Successfully to GitHub Pages!\n\nYour changes from this PR are now live:\n\n* 📖 **Web Docs**: [https://1694srinivasan.github.io/core-circle/](https://1694srinivasan.github.io/core-circle/)\n* 🎨 **UI Storybook**: [https://1694srinivasan.github.io/core-circle/storybook/](https://1694srinivasan.github.io/core-circle/storybook/)\n\n*Deployment automated via GitHub Actions.*`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Comment on PR on Deployment Failure
        if: failure() && needs.check-deploy.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ needs.check-deploy.outputs.pr_number }}', 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `### ❌ GitHub Pages Deployment Failed\n\nThe automated deployment to GitHub Pages failed.\n\n🔍 **View Logs**: [GitHub Actions Run](${runUrl})`;
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
